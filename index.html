<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Itzel Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Itzel Studio">
<meta name="theme-color" content="#fbf7f8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#fbf7f8;
    --surface:#ffffff;
    --surface-2:#f6eef1;
    --ink:#2c2429;
    --ink-soft:#6f626a;
    --ink-faint:#9b8e95;
    --accent:#c97a96;
    --accent-soft:#f3d9e2;
    --accent-deep:#a85a78;
    --line:#ecdfe4;
    --ok:#5a9e7a;
    --ok-soft:#dcefe3;
    --shadow:0 6px 24px rgba(160,110,130,.10);
    --radius:20px;
    --tap:52px;
  }
  [data-theme="dark"]{
    --bg:#191317;
    --surface:#241c21;
    --surface-2:#2e242a;
    --ink:#f4ecef;
    --ink-soft:#c3b3bb;
    --ink-faint:#8c7a83;
    --accent:#e0a0b8;
    --accent-soft:#3a2a32;
    --accent-deep:#f0bccd;
    --line:#362a30;
    --ok:#7fc7a0;
    --ok-soft:#27392f;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    transition:background .35s ease,color .35s ease;
    overscroll-behavior-y:none;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
  .app{max-width:560px;margin:0 auto;min-height:100vh;}
  /* Header */
  header.top{
    position:sticky;top:0;z-index:30;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(140%) blur(12px);
    -webkit-backdrop-filter:saturate(140%) blur(12px);
    padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.2px;}
  .brand .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--accent-soft),var(--accent));}
  .iconbtn{
    width:44px;height:44px;min-width:44px;border:none;border-radius:14px;background:var(--surface-2);
    color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  main{padding:18px 20px 120px;}
  h1{font-size:24px;margin:6px 0 2px;font-weight:700;}
  h2{font-size:17px;margin:26px 0 12px;font-weight:700;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 8px;}
  .muted{color:var(--ink-faint);}
  /* Cards */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  .row{display:flex;align-items:center;gap:12px;}
  .spread{justify-content:space-between;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);
  }
  .pill.ok{background:var(--ok-soft);color:var(--ok);}
  .pill.grey{background:var(--surface-2);color:var(--ink-soft);}
  /* Week cards */
  .weekgrid{display:flex;flex-direction:column;gap:12px;}
  .daycard{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;
    transition:transform .18s ease,border-color .18s ease;
  }
  .daycard:active{transform:scale(.985);}
  .daycard.done{border-color:var(--ok);}
  .daycard.rest{opacity:.78;cursor:default;box-shadow:none;}
  .daybadge{
    width:54px;height:54px;border-radius:16px;flex:0 0 auto;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-weight:700;font-size:11px;letter-spacing:.5px;
    background:var(--accent-soft);color:var(--accent-deep);text-transform:uppercase;line-height:1.1;
  }
  .daybadge .dn{font-size:16px;}
  .daycard.done .daybadge{background:var(--ok-soft);color:var(--ok);}
  .daycard.rest .daybadge{background:var(--surface-2);color:var(--ink-faint);}
  .daymeta{flex:1;min-width:0;}
  .daymeta .t{font-weight:700;font-size:16px;}
  .daymeta .d{font-size:13px;color:var(--ink-soft);}
  .check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
  .daycard.done .check{background:var(--ok);border-color:var(--ok);}
  /* Streak banner */
  .streak{
    background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent) 30%,var(--surface)));
    border:none;color:var(--ink);
  }
  .streak .big{font-size:30px;font-weight:800;color:var(--accent-deep);}
  /* Buttons */
  button{font-family:inherit;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:var(--tap);padding:14px 20px;border-radius:16px;border:none;
    font-size:16px;font-weight:700;cursor:pointer;width:100%;
    background:var(--accent);color:#fff;transition:transform .15s ease,filter .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:var(--surface-2);color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--accent-deep);border:1px solid var(--line);}
  .btn.ok{background:var(--ok);}
  .btn.sm{min-height:44px;padding:10px 16px;font-size:14px;width:auto;}
  .btn.tiny{min-height:40px;padding:8px 12px;font-size:13px;width:auto;border-radius:12px;}
  .btn-row{display:flex;gap:10px;}
  /* Player */
  .player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:slideUp .3s ease;}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .player-top{
    padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;gap:12px;
  }
  .progress{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .progress > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease;border-radius:999px;}
  .player-body{flex:1;overflow-y:auto;padding:8px 18px 24px;-webkit-overflow-scrolling:touch;}
  .player-foot{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);background:var(--surface);}
  .exname{font-size:26px;font-weight:800;margin:10px 0 4px;line-height:1.15;}
  .extarget{font-size:16px;color:var(--ink-soft);font-weight:600;}
  .cue{
    background:var(--accent-soft);color:var(--accent-deep);border-radius:14px;padding:12px 14px;
    font-size:14.5px;font-weight:600;margin:14px 0;display:flex;gap:9px;align-items:flex-start;
  }
  .cue svg{flex:0 0 auto;margin-top:1px;}
  .setlist{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
  .setbtn{
    width:100%;min-height:64px;border-radius:18px;border:2px solid var(--line);background:var(--surface);
    color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    font-size:17px;font-weight:700;cursor:pointer;transition:all .18s ease;
  }
  .setbtn .lbl{display:flex;align-items:center;gap:12px;}
  .setbtn .num{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .setbtn.logged{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .setbtn.logged .num{background:var(--ok);color:#fff;}
  .setbtn:active{transform:scale(.98);}
  .setbtn .reps{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .setbtn.logged .reps{color:var(--ok);}
  /* Rest screen */
  .rest-screen{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,var(--accent-soft),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
  .rest-num{font-size:84px;font-weight:800;color:var(--accent-deep);font-variant-numeric:tabular-nums;line-height:1;}
  .rest-ring{position:relative;width:220px;height:220px;margin:10px 0 20px;}
  .rest-ring svg{transform:rotate(-90deg);}
  .rest-ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .rest-prompt{font-size:18px;font-weight:600;margin-bottom:6px;}
  .rest-next{color:var(--ink-soft);font-size:15px;margin-top:6px;}
  .rest-next b{color:var(--ink);}
  /* Activation */
  .act-screen{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,var(--accent-soft),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
  .hold-num{font-size:96px;font-weight:800;color:var(--accent-deep);font-variant-numeric:tabular-nums;line-height:1;}
  .actmove{font-size:24px;font-weight:800;margin:4px 0;}
  .actrep{font-size:15px;color:var(--ink-soft);}
  /* Settings list */
  .setting{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px;}
  .setting:last-child{border-bottom:none;}
  .setting .lab{font-size:15px;}
  .setting .desc{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
  .switch{width:52px;height:32px;border-radius:999px;background:var(--surface-2);border:none;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s ease;}
  .switch.on{background:var(--accent);}
  .switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch.on i{transform:translateX(20px);}
  /* Tabs */
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;gap:6px;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
  }
  .tab{flex:1;max-width:140px;border:none;background:transparent;color:var(--ink-faint);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;min-height:48px;}
  .tab.active{color:var(--accent-deep);}
  .tab svg{width:24px;height:24px;}
  /* Modal */
  .modal-bg{position:fixed;inset:0;z-index:70;background:rgba(40,30,36,.45);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow-y:auto;animation:slideUp .28s ease;}
  .sheet h3{margin:0 0 4px;font-size:20px;}
  .grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 16px;}
  input[type=number],input[type=text],select{
    font-family:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);width:100%;
  }
  label.fld{display:block;margin-bottom:14px;}
  label.fld span{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .stepper{display:flex;align-items:center;gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .stepper button{width:54px;height:54px;border:none;background:var(--surface-2);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer;}
  .stepper button:active{background:var(--accent-soft);}
  .stepper .val{flex:1;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .extlink{color:var(--accent-deep);text-decoration:none;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
  .swap-item{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;}
  .swap-item:active{background:var(--surface-2);}
  video.form-clip{width:100%;border-radius:14px;background:#000;margin-top:10px;max-height:300px;}
  .ss-tag{font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:3px 8px;border-radius:8px;display:inline-block;margin-bottom:6px;}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:90%;text-align:center;animation:fade .2s ease;}
  .center{text-align:center;}
  .gap{height:8px;}
  .hidden{display:none !important;}
  .equip-toggle{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .equip-toggle button{flex:1;border:none;background:var(--surface);color:var(--ink-soft);padding:8px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px;}
  .equip-toggle button.on{background:var(--accent);color:#fff;}
  .next-preview{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px;text-align:left;width:100%;max-width:360px;}
  .next-preview .k{font-size:12px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .achv{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);margin-bottom:8px;}
  .achv .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .achv.locked{opacity:.5;}
  .progress-mini{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:4px;}
  .progress-mini > i{display:block;height:100%;background:var(--accent);border-radius:999px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot"></span> Itzel Studio</div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>

<script>
"use strict";
/* ============================================================
   Itzel Studio — guided strength PWA. Single file, offline.
   State variable declared FIRST (no TDZ on boot).
   ============================================================ */
var S;            // main state — declared with var, hoisted & safe
var DB = null;    // IndexedDB handle for My Form clips
var player = null;// active session player state
var toastTimer = null;

/* ---------- Constants / Program Defaults ---------- */
var LS_KEY = "itzel_studio_v1";
var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Exercise library. Each: id, name, cue, demo (external), rest secs,
// gym & home variant text. Weights are placeholders Itzel edits.
function defaultExercises(){
  return {
    hipthrust:{ id:"hipthrust", name:"Hip Thrust", pr:true,
      cue:"Drive through heels, squeeze at the top, ribs down — chin tucked.",
      demo:"https://www.youtube.com/results?search_query=barbell+hip+thrust+form",
      rest:120, gym:"Barbell on bench", home:"Single-leg / band glute bridge" },
    rdl:{ id:"rdl", name:"RDL", pr:true,
      cue:"Slow lowering, never sink into the stretch — soft knees, hinge back.",
      demo:"https://www.youtube.com/results?search_query=romanian+deadlift+form",
      rest:120, gym:"Barbell or dumbbells", home:"Dumbbell / kettlebell hinge" },
    cableabd:{ id:"cableabd", name:"Cable Hip Abduction", pr:false,
      cue:"Tall posture, push the knee out and away — no leaning.",
      demo:"https://www.youtube.com/results?search_query=cable+hip+abduction",
      rest:75, gym:"Cable, ankle cuff", home:"Standing band abduction" },
    backext:{ id:"backext", name:"Back Extension", pr:false,
      cue:"Round up segment by segment, glutes finish the lift — don't hyperextend.",
      demo:"https://www.youtube.com/results?search_query=45+degree+back+extension+glutes",
      rest:75, gym:"45° back-ext bench", home:"Floor superman / hip hinge" },
    bulgarian:{ id:"bulgarian", name:"Long-Stride Bulgarian Split Squat", pr:false,
      cue:"Stop one inch before lockout — long stride, weight in the front heel.",
      demo:"https://www.youtube.com/results?search_query=long+stride+bulgarian+split+squat",
      rest:90, gym:"Dumbbells + bench", home:"Bodyweight / backpack + chair" },
    row:{ id:"row", name:"Chest-Supported Row", pr:false,
      cue:"Lead with the elbows, pause at the squeeze — chest stays on the pad.",
      demo:"https://www.youtube.com/results?search_query=chest+supported+row",
      rest:75, gym:"Chest-supported / seated row", home:"Band row / bent-over DB row" },
    shoulderpress:{ id:"shoulderpress", name:"Supported Shoulder Press", pr:false,
      cue:"Back supported, press up and slightly in — stop just short of locking out.",
      demo:"https://www.youtube.com/results?search_query=machine+shoulder+press",
      rest:75, gym:"Machine / supported DB press", home:"Seated DB press on chair" },
    facepull:{ id:"facepull", name:"Face Pulls", pr:false,
      cue:"Pull to the forehead, thumbs back — slow and high, no shrug.",
      demo:"https://www.youtube.com/results?search_query=face+pull+form",
      rest:60, gym:"Cable + rope", home:"Band face pull" },
    sumo:{ id:"sumo", name:"Wide-Stance Sumo / Goblet Squat", pr:false,
      cue:"Wide stance, toes out, knees track over toes — sit between the hips.",
      demo:"https://www.youtube.com/results?search_query=wide+stance+goblet+squat",
      rest:90, gym:"Goblet DB / sumo", home:"Goblet with backpack" }
  };
}

// Activation circuit: ~10 min, hold-timer guided. Counts DOWN on screen.
function defaultActivation(){
  return [
    { name:"Glute Bridge — 5s hold", reps:"8 reps · 5s hold each", hold:5, rounds:8, rest:6 },
    { name:"Dead Bug", reps:"6 each side · slow", hold:3, rounds:6, rest:5 },
    { name:"Banded Clamshell", reps:"10 each side · 2s hold", hold:2, rounds:10, rest:4 },
    { name:"Bird Dog — 5s hold", reps:"6 each side", hold:5, rounds:6, rest:6 },
    { name:"Wall Sit", reps:"hold strong", hold:20, rounds:1, rest:8 },
    { name:"Standing Hip Abduction", reps:"12 each side", hold:2, rounds:12, rest:4 }
  ];
}

// Session templates. setSchemes editable; weights placeholder.
// superset: array of exercise-id groups that auto-cycle.
function defaultProgram(){
  var ex = defaultExercises();
  function mk(id, sets, reps, wt){
    return { ex:id, sets:sets, reps:reps, weight:wt, restOverride:null };
  }
  return {
    exercises: ex,
    activation: defaultActivation(),
    sessions: {
      heavy:{ key:"heavy", label:"Heavy", day:1, color:"heavy",
        blurb:"Lower-rep strength. Take your rests.",
        items:[
          mk("hipthrust",4,"5-6","135 lb"),
          mk("rdl",4,"6-8","95 lb"),
          { superset:["bulgarian","row"], pairs:[
              mk("bulgarian",3,"6-8 ea","25 lb"),
              mk("row",3,"8-10","60 lb") ] },
          mk("shoulderpress",3,"8-10","40 lb")
        ] },
      moderate:{ key:"moderate", label:"Moderate", day:3, color:"moderate",
        blurb:"Balanced volume. Smooth and controlled.",
        items:[
          mk("hipthrust",4,"8-10","115 lb"),
          mk("sumo",3,"10-12","40 lb"),
          { superset:["backext","cableabd"], pairs:[
              mk("backext",3,"12-15","BW"),
              mk("cableabd",3,"12-15 ea","15 lb") ] },
          mk("facepull",3,"15-20","20 lb")
        ] },
      light:{ key:"light", label:"Light", day:5, color:"light",
        blurb:"Higher reps, kinder load. Move and breathe.",
        items:[
          mk("hipthrust",3,"12-15","95 lb"),
          mk("rdl",3,"10-12","65 lb"),
          { superset:["cableabd","facepull"], pairs:[
              mk("cableabd",3,"15-20 ea","12 lb"),
              mk("facepull",3,"15-20","15 lb") ] },
          mk("backext",2,"15","BW")
        ] }
    },
    // weekly schedule: index by day-of-week 0..6
    schedule:[ "rest","heavy","rest","moderate","rest","light","rest" ]
  };
}

/* ---------- State ---------- */
function freshState(){
  return {
    program: defaultProgram(),
    logs: {},            // dateKey -> { type, items:[{ex,sets:[{reps,weight,done}]}], flare, stoppedSmart, completedAt }
    settings:{
      theme:"light",
      potsCard:true,      // show pre-session POTS card
      potsDismissPref:false, // remembered "don't show" preference
      dailyLine:false,    // gentle daily line OFF by default
      monthlyAchv:false,  // monthly achievements OFF by default
      sound:true
    },
    equip:{},             // exId -> "gym"|"home" (per-exercise current)
    formClips:{},         // exId -> { id, name } (blob lives in IndexedDB)
    weekStart: startOfWeek(new Date()).getTime(),
    streakWeeks:0,
    lastCompletedWeek:null
  };
}

function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var p = JSON.parse(raw);
      S = Object.assign(freshState(), p);
      // ensure nested defaults exist after upgrades
      if(!S.program || !S.program.sessions) S.program = defaultProgram();
      if(!S.settings) S.settings = freshState().settings;
      if(!S.equip) S.equip = {};
      if(!S.formClips) S.formClips = {};
      if(!S.logs) S.logs = {};
    } else {
      S = freshState();
    }
  }catch(e){
    S = freshState();
  }
  rolloverWeekIfNeeded();
  return S;
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}

/* ---------- Date helpers ---------- */
function startOfWeek(d){
  var x = new Date(d);
  x.setHours(0,0,0,0);
  var dow = x.getDay(); // 0 Sun
  x.setDate(x.getDate()-dow); // week starts Sunday
  return x;
}
function dateKey(d){
  var x = new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
function rolloverWeekIfNeeded(){
  var now = startOfWeek(new Date()).getTime();
  if(S.weekStart !== now){
    // finalize prior week streak
    var prevDone = countWeekCompletedSessions(S.weekStart);
    if(prevDone >= 2){
      S.streakWeeks = (S.streakWeeks||0)+1;
      S.lastCompletedWeek = S.weekStart;
    } else {
      S.streakWeeks = 0;
    }
    S.weekStart = now;
    save();
  }
}
function weekDates(ws){
  var arr=[]; var base=new Date(ws);
  for(var i=0;i<7;i++){ var d=new Date(base); d.setDate(base.getDate()+i); arr.push(d); }
  return arr;
}
function countWeekCompletedSessions(ws){
  var dates = weekDates(ws); var n=0;
  dates.forEach(function(d){
    var lg = S.logs[dateKey(d)];
    if(lg && lg.completedAt) n++;
  });
  return n;
}

/* ---------- IndexedDB for My Form clips ---------- */
function openDB(){
  return new Promise(function(res){
    try{
      var rq = indexedDB.open("itzel_form_clips",1);
      rq.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains("clips")) db.createObjectStore("clips");
      };
      rq.onsuccess = function(e){ DB = e.target.result; res(DB); };
      rq.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function putClip(exId, blob){
  return new Promise(function(res,rej){
    if(!DB){ rej("no db"); return; }
    var tx = DB.transaction("clips","readwrite");
    tx.objectStore("clips").put(blob, exId);
    tx.oncomplete = function(){ res(true); };
    tx.onerror = function(){ rej("write failed"); };
  });
}
function getClip(exId){
  return new Promise(function(res){
    if(!DB){ res(null); return; }
    var tx = DB.transaction("clips","readonly");
    var rq = tx.objectStore("clips").get(exId);
    rq.onsuccess = function(){ res(rq.result||null); };
    rq.onerror = function(){ res(null); };
  });
}
function delClip(exId){
  return new Promise(function(res){
    if(!DB){ res(false); return; }
    var tx = DB.transaction("clips","readwrite");
    tx.objectStore("clips").delete(exId);
    tx.oncomplete = function(){ res(true); };
    tx.onerror = function(){ res(false); };
  });
}

function stepperField(label,val,min,max,onchange){
  var wrapEl=el('<label class="fld"><span>'+esc(label)+'</span></label>');
  var st=el('<div class="stepper"></div>');
  var minus=el('<button type="button">–</button>');
  var v=el('<div class="val">'+val+'</div>');
  var plus=el('<button type="button">+</button>');
  minus.onclick=function(){ if(val>min){ val--; v.textContent=val; onchange(val); } };
  plus.onclick=function(){ if(val<max){ val++; v.textContent=val; onchange(val); } };
  st.appendChild(minus); st.appendChild(v); st.appendChild(plus);
  wrapEl.appendChild(st);
  return wrapEl;
}

    { ic:"🌱", name:"First session this month", hit:totalSessions>=1, prog:Math.min(1,totalSessions) },
    { ic:"💪", name:"4 sessions in a month", hit:totalSessions>=4, prog:totalSessions/4 },
    { ic:"🌸", name:"8 sessions in a month", hit:totalSessions>=8, prog:totalSessions/8 },
    { ic:"🔥", name:"Streak: 4 weeks", hit:S.streakWeeks>=4, prog:S.streakWeeks/4 }
  ];
  c.appendChild(el('<p class="sub">'+totalSessions+' sessions · '+totalSets+' sets logged.</p>'));
  achv.forEach(function(a){

function buildQueue(sess, mode){
  var q=[];
  if(mode==="flare"){
    // Floor: hip thrust + one row only
    var ht = findItem(sess,"hipthrust") || { ex:"hipthrust", sets:3, reps:"10-12", weight:"light" };
    var rowItem = findItem(sess,"row") || { ex:"row", sets:2, reps:"12-15", weight:"light" };
    q.push({ kind:"single", item:cloneItem(ht) });
    q.push({ kind:"single", item:cloneItem(rowItem) });
    return q;
  }
  sess.items.forEach(function(it){
    if(it.superset){
      // expand into alternating rounds: A1,B1,A2,B2...
      var rounds=Math.max.apply(null, it.pairs.map(function(p){return p.sets;}));
      q.push({ kind:"superset", pairs:it.pairs.map(cloneItem), rounds:rounds });
    } else {
      q.push({ kind:"single", item:cloneItem(it) });
    }
  });
  return q;
}
function findItem(sess,exId){
  var found=null;
  sess.items.forEach(function(it){
    if(it.superset){ it.pairs.forEach(function(p){ if(p.ex===exId) found=p; }); }
    else if(it.ex===exId) found=it;
  });
  return found;
}
function cloneItem(it){ return JSON.parse(JSON.stringify(it)); }

/* ----- Fullscreen mount helpers ----- */
function mountFullscreen(node){

/* ----- ACTIVATION CIRCUIT (hold timers, counts DOWN) ----- */
function startActivation(){
  runActivation(function(){ player.activationDone=true; runQueue(); });
}
function runActivation(onComplete){
  var moves=S.program.activation;
  var mi=0, round=1, phase="hold", remaining=moves[0].hold;
  var scr=el('<div class="act-screen"></div>');
  var pill=el('<div class="pill" style="margin-bottom:14px">10-min activation</div>');
  var prog=el('<div class="progress" style="max-width:300px;margin-bottom:20px"><i></i></div>');
  var move=el('<div class="actmove"></div>');
  var rep=el('<div class="actrep"></div>');
  var ring=el('<div class="hold-num"></div>');
  var phaseLbl=el('<div class="rest-prompt" style="margin-top:10px"></div>');
  // big Pause/Resume — pauses a hold or the rest between moves
  var pauseBtn=el('<button class="btn secondary" style="max-width:300px;margin-top:22px">⏸ Pause</button>');
  var skip=el('<button class="btn ghost" style="max-width:300px;margin-top:10px">Skip activation</button>');
  scr.appendChild(pill); scr.appendChild(prog); scr.appendChild(move); scr.appendChild(rep);
  scr.appendChild(el('<div style="height:18px"></div>'));
  scr.appendChild(ring); scr.appendChild(phaseLbl); scr.appendChild(pauseBtn); scr.appendChild(skip);
  mountFullscreen(scr);

  var totalUnits=0,doneUnits=0,paused=false;
  moves.forEach(function(m){ totalUnits+=m.rounds; });

  function paint(){
    var m=moves[mi];
    move.textContent=m.name;
    rep.textContent=m.reps+"  ·  set "+round+" of "+m.rounds;
    ring.textContent=remaining;
    phaseLbl.textContent = paused ? "Paused" : (phase==="hold" ? "Hold steady" : "Reset");
    prog.querySelector("i").style.width=Math.round((doneUnits/totalUnits)*100)+"%";
  }
  paint();

  function tick(){
    remaining--;
    if(remaining<=0){
      if(phase==="hold"){
        doneUnits++;
        if(round< moves[mi].rounds){
          round++; phase="rest"; remaining=moves[mi].rest;
        } else {
          // next move
          mi++;
          if(mi>=moves.length){
            clearInterval(player._tick); player._tick=null;
            onComplete(); return;
          }
          round=1; phase="hold"; remaining=moves[mi].hold;
        }
      } else {
        phase="hold"; remaining=moves[mi].hold;
      }
    }
    paint();
  }
  function startTick(){ if(player._tick){ clearInterval(player._tick); } player._tick=setInterval(tick,1000); }
  startTick();

  pauseBtn.onclick=function(){
    paused=!paused;
    if(paused){
      // halt countdown, remember remaining/phase right where they are
      if(player._tick){ clearInterval(player._tick); player._tick=null; }
      pauseBtn.textContent="▶ Resume";
      pauseBtn.classList.add("ok");
    } else {
      // continue from the remembered remaining
      startTick();
      pauseBtn.textContent="⏸ Pause";
      pauseBtn.classList.remove("ok");
    }
    paint();
  };
  skip.onclick=function(){ clearInterval(player._tick); player._tick=null; onComplete(); };
}

/* ----- MAIN EXERCISE QUEUE ----- */
function runQueue(){ showCurrentExercise(); }

function totalQueueSets(){
  var n=0;
  player.queue.forEach(function(q){
    if(q.kind==="single") n+=q.item.sets;
    else q.pairs.forEach(function(p){ n+=p.sets; });
  });
  return n;
}
function loggedSetsCount(){
  var n=0;
  player.log.items.forEach(function(it){ (it.sets||[]).forEach(function(s){ if(s.done) n++; }); });
  return n;
}
function ensureLogItem(exId){
  var found=null;
  player.log.items.forEach(function(it){ if(it._key===exId+"") found=it; });
  if(!found){ found={ _key:exId+"", ex:exId, sets:[] }; player.log.items.push(found); }
  return found;
}

function showCurrentExercise(){
  if(player.idx>=player.queue.length){ finishSession(false); return; }
  var node=player.queue[player.idx];
  if(node.kind==="single") showSingle(node);
  else showSuperset(node);
}

function progressBarFrac(){
  var t=totalQueueSets(); if(t===0) return 0;
  return Math.min(1, loggedSetsCount()/t);
}

function playerShell(innerNode){

  stop.onclick=function(){ stopRule(); };
  top.appendChild(back); top.appendChild(prog); top.appendChild(stop);
  shell.appendChild(top);
  var bodyWrap=el('<div class="player-body"></div>');
  bodyWrap.appendChild(innerNode);
  shell.appendChild(bodyWrap);

}

function exHeader(item){
  var ex=exById(item.ex);
  var eq=currentEquip(item.ex);
  var node=el('<div></div>');
  node.appendChild(el('<div class="extarget">'+esc(item.sets)+' sets × '+esc(item.reps)+'</div>'));
  node.appendChild(el('<div class="exname">'+esc(ex.name)+'</div>'));
  node.appendChild(el('<div class="extarget">Target: '+esc(item.weight)+'</div>'));

  // equipment toggle
  var et=el('<div class="equip-toggle" style="margin-top:14px;max-width:240px"></div>');

  var h=el('<button class="'+(eq==="home"?"on":"")+'">Home</button>');

  h.onclick=function(){ S.equip[item.ex]="home"; save(); refreshCurrent(); };
  et.appendChild(g); et.appendChild(h);
  node.appendChild(et);
  node.appendChild(el('<div class="muted" style="font-size:13px;margin-top:6px">'+esc(eq==="home"?ex.home:ex.gym)+'</div>'));

  }

  row.appendChild(el('<a class="btn ghost sm" target="_blank" rel="noopener" href="'+esc(ex.demo)+'">'+ICON.ext+' Demo</a>'));
  var myform=el('<button class="btn secondary sm">My Form</button>');
  myform.onclick=function(){ openFormSheet(item.ex); };
  row.appendChild(myform);
  var swap=el('<button class="btn secondary sm">Joint ache? Swap</button>');
  swap.onclick=function(){ offerSwap(item); };
  row.appendChild(swap);
  node.appendChild(row);
  return node;
}

var refreshCurrent = function(){ showCurrentExercise(); };

function showSingle(node){
  var item=node.item;
  var inner=el('<div></div>');
  inner.appendChild(exHeader(item));
  var logItem=ensureLogItem(item.ex);
  var setlist=el('<div class="setlist"></div>');
  for(var i=0;i<item.sets;i++){
    (function(i){
      var existing=logItem.sets[i];
      var done=existing&&existing.done;
      var b=el('<button class="setbtn '+(done?"logged":"")+'"><span class="lbl"><span class="num">'+(done?ICON.check:(i+1))+'</span>Set '+(i+1)+'</span><span class="reps">'+esc(item.reps)+' · '+esc(item.weight)+'</span></button>');
      b.onclick=function(){
        logItem.sets[i]={ reps:item.reps, weight:item.weight, done:true };
        // refresh progress on shell
        var doneNow=logItem.sets.filter(function(s){return s&&s.done;}).length;
        b.classList.add("logged"); b.querySelector(".num").innerHTML=ICON.check;
        updateProgressBar();
        // all sets of this single done? -> rest then advance
        if(doneNow>=item.sets){
          afterSet(item, function(){ player.idx++; showCurrentExercise(); });
        } else {
          afterSet(item, function(){ /* stay on same exercise, next set */ });
        }
      };
      setlist.appendChild(b);
    })(i);
  }
  inner.appendChild(setlist);

  var shell=playerShell(inner);
  // footer: skip exercise
  var foot=el('<div class="player-foot"></div>');
  var skip=el('<button class="btn secondary">Skip to next exercise</button>');
  skip.onclick=function(){ player.idx++; showCurrentExercise(); };
  foot.appendChild(skip);
  shell.appendChild(foot);
  mountFullscreen(shell);
}

function showSuperset(node){
  // alternating: render current round across pairs; tap logs the current pair-set
  var inner=el('<div></div>');
  inner.appendChild(el('<div class="ss-tag">Superset · auto-cycled</div>'));
  // figure current round = min logged across pairs
  var roundIdx = ssCurrentRound(node);
  if(roundIdx>=node.rounds){ player.idx++; showCurrentExercise(); return; }
  inner.appendChild(el('<div class="extarget" style="margin-bottom:4px">Round '+(roundIdx+1)+' of '+node.rounds+'</div>'));

  node.pairs.forEach(function(p,pi){
    var ex=exById(p.ex);
    var logItem=ensureLogItem(p.ex);
    var thisSetDone = logItem.sets[roundIdx] && logItem.sets[roundIdx].done;
    var card=el('<div class="card" style="margin-bottom:12px;border-color:'+(thisSetDone?"var(--ok)":"var(--line)")+'"></div>');
    card.appendChild(el('<div style="font-weight:700;font-size:18px">'+esc(ex.name)+'</div>'));
    card.appendChild(el('<div class="extarget" style="font-size:14px">'+esc(p.reps)+' · '+esc(p.weight)+'</div>'));
    if(ex.cue) card.appendChild(el('<div class="cue" style="margin:10px 0 6px">'+ICON.spark+'<span>'+esc(ex.cue)+'</span></div>'));
    var demoRow=el('<div class="btn-row" style="margin-bottom:8px"></div>');
    demoRow.appendChild(el('<a class="btn ghost sm" target="_blank" rel="noopener" href="'+esc(ex.demo)+'">'+ICON.ext+' Demo</a>'));
    var mf=el('<button class="btn secondary sm">My Form</button>'); mf.onclick=function(){ openFormSheet(p.ex); };
    demoRow.appendChild(mf);
    card.appendChild(demoRow);
    var b=el('<button class="setbtn '+(thisSetDone?"logged":"")+'"><span class="lbl"><span class="num">'+(thisSetDone?ICON.check:(roundIdx+1))+'</span>Log set '+(roundIdx+1)+'</span><span class="reps">'+esc(p.reps)+'</span></button>');
    b.onclick=function(){
      if(logItem.sets[roundIdx] && logItem.sets[roundIdx].done) return;
      logItem.sets[roundIdx]={ reps:p.reps, weight:p.weight, done:true };
      b.classList.add("logged"); b.querySelector(".num").innerHTML=ICON.check;
      updateProgressBar();
      // both pairs done for this round?
      var allDone = node.pairs.every(function(pp){ var li=ensureLogItem(pp.ex); return li.sets[roundIdx]&&li.sets[roundIdx].done; });
      if(allDone){
        // rest, then re-render (advances round or moves on)
        afterSet(p, function(){ showCurrentExercise(); });
      }
      // if not all done, just stay — she taps the other one (no rest between superset pair)
    };
    card.appendChild(b);
    inner.appendChild(card);
  });

  var shell=playerShell(inner);
  var foot=el('<div class="player-foot"></div>');
  var skip=el('<button class="btn secondary">Skip superset</button>');
  skip.onclick=function(){ player.idx++; showCurrentExercise(); };
  foot.appendChild(skip);
  shell.appendChild(foot);
  mountFullscreen(shell);
}

function ssCurrentRound(node){
  var minRound=node.rounds;
  node.pairs.forEach(function(p){
    var li=ensureLogItem(p.ex);
    var c=0; for(var i=0;i<node.rounds;i++){ if(li.sets[i]&&li.sets[i].done) c++; else break; }
    if(c<minRound) minRound=c;
  });
  return minRound;
}

function updateProgressBar(){
  var bar=document.querySelector(".player .progress > i");
  if(bar) bar.style.width=Math.round(progressBarFrac()*100)+"%";
}

/* ----- TIMED REST ----- */
function afterSet(item, then){
  var secs=exRest(item);
  var ex=exById(item.ex);
  // determine next-up preview
  var nextLabel=nextUpLabel();
  var scr=el('<div class="rest-screen"></div>');
  scr.appendChild(el('<div class="pill" style="margin-bottom:8px">Rest</div>'));
  scr.appendChild(el('<div class="rest-prompt">Sit down, sip water 🩷</div>'));
  scr.appendChild(el('<p class="sub center" style="max-width:300px;margin-top:0">Let your heart rate settle. No rush — your set is saved.</p>'));

  var R=120;
  var ring=el('<div class="rest-ring"></div>');
  var size=220, r=98, circ=2*Math.PI*r;
  var svg=el('<svg width="'+size+'" height="'+size+'"><circle cx="110" cy="110" r="'+r+'" stroke="var(--surface-2)" stroke-width="14" fill="none"/><circle id="restArc" cx="110" cy="110" r="'+r+'" stroke="var(--accent)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="0"/></svg>');
  var innerR=el('<div class="inner"><div class="rest-num" id="restNum"></div></div>');
  ring.appendChild(svg); ring.appendChild(innerR);
  scr.appendChild(ring);

  if(nextLabel){
    scr.appendChild(el('<div class="next-preview"><div class="k">Next up</div><div style="font-weight:700;font-size:16px;margin-top:2px">'+esc(nextLabel.name)+'</div><div class="muted" style="font-size:13px">'+esc(nextLabel.detail)+'</div></div>'));
  }

  // big Pause/Resume button — full width, easy to hit
  var pauseBtn=el('<button class="btn secondary" style="margin-top:14px;max-width:320px">⏸ Pause</button>');
  scr.appendChild(pauseBtn);

  var ctr=el('<div class="btn-row" style="margin-top:10px;max-width:320px"></div>');
  var add=el('<button class="btn secondary">+20s</button>');
  var skip=el('<button class="btn">Skip rest</button>');
  ctr.appendChild(add); ctr.appendChild(skip);
  scr.appendChild(ctr);

  mountFullscreen(scr);

  var remaining=secs;
  var paused=false;
  var arc=svg.querySelector("#restArc");
  var numEl=innerR.querySelector("#restNum");
  function paint(){
    numEl.textContent=remaining;
    var frac=remaining/secs;
    arc.setAttribute("stroke-dashoffset", String(circ*(1-frac)));
  }
  paint();
  function tick(){
    remaining--;
    if(remaining<=0){ clearInterval(player._tick); player._tick=null; chime(); endRest(); return; }
    paint();
  }
  function startTick(){ if(player._tick){ clearInterval(player._tick); } player._tick=setInterval(tick,1000); }
  startTick();

  function endRest(){ teardownFullscreen(); then(); }
  add.onclick=function(){ remaining+=20; secs+=20; paint(); };
  skip.onclick=function(){ clearInterval(player._tick); player._tick=null; endRest(); };
  pauseBtn.onclick=function(){
    paused=!paused;
    if(paused){
      // halt countdown, keep remaining where it is
      if(player._tick){ clearInterval(player._tick); player._tick=null; }
      pauseBtn.textContent="▶ Resume";
      pauseBtn.classList.add("ok");
    } else {
      // continue from the remembered remaining
      startTick();
      pauseBtn.textContent="⏸ Pause";
      pauseBtn.classList.remove("ok");
    }
  };
}

function nextUpLabel(){
  // peek at what comes after current logged position
  var node=player.queue[player.idx];
  if(!node) return null;
  if(node.kind==="single"){
    var li=ensureLogItem(node.item.ex);
    var doneN=li.sets.filter(function(s){return s&&s.done;}).length;
    if(doneN<node.item.sets){
      var ex=exById(node.item.ex);
      return { name:ex.name+" — set "+(doneN+1), detail:node.item.reps+" · "+node.item.weight };
    }
    // moving to next node
    var nx=player.queue[player.idx+1];
    return nodeLabel(nx);
  } else {
    var rd=ssCurrentRound(node);
    if(rd<node.rounds){
      return { name:"Superset — round "+(rd+1), detail:node.pairs.map(function(p){return exById(p.ex).name;}).join(" + ") };
    }
    return nodeLabel(player.queue[player.idx+1]);
  }
}
function nodeLabel(nx){
  if(!nx) return { name:"Finish line", detail:"Last effort, then you're done." };
  if(nx.kind==="single"){ var ex=exById(nx.item.ex); return { name:ex.name, detail:nx.item.sets+"×"+nx.item.reps+" · "+nx.item.weight }; }
  return { name:"Superset", detail:nx.pairs.map(function(p){return exById(p.ex).name;}).join(" + ") };
}

function chime(){
  if(!S.settings.sound) return;
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    var ctx=new Ctx();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type="sine"; o.frequency.value=660;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.7);
    o.start(); o.stop(ctx.currentTime+0.75);
    setTimeout(function(){ try{ctx.close();}catch(e){} },900);
  }catch(e){}
}

/* ----- SWAP (joint ache → instant swap) ----- */
function offerSwap(item){
  var body=el('<div></div>');
  body.appendChild(el('<h3>Deep joint ache?</h3>'));
  body.appendChild(el('<p class="sub">Let\'s switch to something that feels better. Pick a swap — your logged sets carry over.</p>'));
  var swapMap={
    hipthrust:["backext","sumo"],
    rdl:["backext","bulgarian"],
    bulgarian:["sumo","hipthrust"],
    sumo:["hipthrust","backext"],
    row:["facepull","backext"],
    shoulderpress:["facepull","row"],
    cableabd:["backext","facepull"],
    backext:["cableabd","hipthrust"],
    facepull:["row","cableabd"]
  };
  var opts=swapMap[item.ex]||["backext","facepull"];
  opts.forEach(function(oid){
    var ex=exById(oid); if(!ex) return;
    var row=el('<div class="swap-item"><div><div style="font-weight:700">'+esc(ex.name)+'</div><div class="muted" style="font-size:12.5px">'+esc(ex.cue)+'</div></div><span class="pill">Swap</span></div>');
    row.onclick=function(){
      item.ex=oid;
      // reset this item's logged sets (new movement)
      var li=ensureLogItem(oid);
      closeModal();
      showCurrentExercise();
      toast("Swapped to "+ex.name+". Listen to your body. 🩷");
    };
    body.appendChild(row);
  });
  var none=el('<button class="btn secondary" style="margin-top:6px">Keep current, lighten it</button>');
  none.onclick=function(){ closeModal(); toast("Drop the weight and slow it down. You know your body."); };
  body.appendChild(none);
  showModal(body);
}

/* ----- STOP RULE ----- */
function stopRule(){
  var body=el('<div></div>');
  body.appendChild(el('<h3>Not feeling right?</h3>'));
  body.appendChild(el('<p class="sub">Stopping now is the strong choice. Everything you logged is saved, and today still counts.</p>'));
  var yes=el('<button class="btn">End session — save what I did</button>');
  yes.onclick=function(){ closeModal(); finishSession(true); };
  var back=el('<button class="btn secondary" style="margin-top:10px">Keep going gently</button>');
  back.onclick=closeModal;
  body.appendChild(yes); body.appendChild(back);
  showModal(body);
}

function confirmExit(){
  var body=el('<div></div>');
  body.appendChild(el('<h3>Leave session?</h3>'));
  body.appendChild(el('<p class="sub">Your logged sets are saved either way.</p>'));
  var save_=el('<button class="btn">Save &amp; mark today done</button>');
  save_.onclick=function(){ closeModal(); finishSession(false); };
  var leave=el('<button class="btn secondary" style="margin-top:10px">Just close (keep day open)</button>');
  leave.onclick=function(){ closeModal(); persistPartial(false); teardownFullscreen(); setTab("week"); };
  var stay=el('<button class="btn ghost" style="margin-top:10px">Stay</button>');
  stay.onclick=closeModal;
  body.appendChild(save_); body.appendChild(leave); body.appendChild(stay);
  showModal(body);
}

function persistPartial(markDone, stoppedSmart){
  // write current player.log to S.logs (without completedAt unless markDone)
  var entry={
    type:player.type, flare:!!player.flare, walk:!!player.walk,
    items:player.log.items.map(function(it){ return { ex:it.ex, sets:it.sets }; }),
    startedAt:player.log.startedAt
  };
  if(markDone){ entry.completedAt=Date.now(); }
  if(stoppedSmart){ entry.stoppedSmart=true; entry.note="Stopped smart — saved."; }
  if(player.flare){ entry.note=(entry.note?entry.note+" ":"")+"Flare — Floor version. Counted."; }
  S.logs[player.dateKey]=entry;
  save();
}

function finishSession(stoppedSmart){
  persistPartial(true, stoppedSmart);
  teardownFullscreen();
  // celebration screen
  var done=countWeekCompletedSessions(S.weekStart);
  var scr=el('<div class="act-screen"></div>');
  scr.appendChild(el('<div style="font-size:64px;margin-bottom:6px">'+(player.flare?"🌸":"🩷")+'</div>'));
  scr.appendChild(el('<div class="actmove">'+(stoppedSmart?"Stopped smart.":(player.flare?"Flare day, done.":"Session complete."))+'</div>'));
  scr.appendChild(el('<p class="sub center" style="max-width:300px">'+(stoppedSmart?"You listened to your body. That\'s training too. Everything is saved.":(player.flare?"You met today where it was. That\'s a real win — and it counts toward your week.":"That\'s "+done+" this week. You did the thing."))+'</p>'));
  if(done>=2){
    scr.appendChild(el('<div class="pill ok" style="margin-top:10px">'+ICON.check+' Week complete</div>'));
  }
  var back=el('<button class="btn" style="max-width:300px;margin-top:22px">Back to my week</button>');
  back.onclick=function(){ teardownFullscreen(); player=null; setTab("week"); };
  scr.appendChild(back);
  mountFullscreen(scr);
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  var t=S.settings.theme;
  if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  var tc=document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute("content", t==="dark"?"#191317":"#fbf7f8");
}
function toggleTheme(){
  S.settings.theme = S.settings.theme==="dark"?"light":"dark";
  save(); applyTheme();
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  load();                 // assigns S (var — no TDZ)
  applyTheme();
  document.getElementById("themeBtn").onclick=toggleTheme;
  render();
  openDB();               // async, fine to lag behind UI
}
boot();
